name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: garmin
          POSTGRES_PASSWORD: garmin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garmin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      GARMIN_MCP_TEST_ADMIN_DSN: postgresql://garmin:garmin@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  # Glama builds the listing with `uv sync`, so uv.lock is what they actually
  # install. A lock that drifts from pyproject is worse than no lock at all.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # setup-uv publishes floating major tags only through v7; v8 and v9 exist
      # solely as exact version tags, so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Check uv.lock is up to date
        run: uv lock --check

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: garmin
          POSTGRES_PASSWORD: garmin
          POSTGRES_DB: garmin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garmin -d garmin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      GARMIN_MCP_TEST_DATABASE_URL: postgresql://garmin:garmin@localhost:5432/garmin_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Validate Docker Compose deployment
        run: docker compose --env-file .env.example config --quiet
      - name: Test
        run: pytest -q

  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Test database-independent parsers, config, and auth
        run: pytest tests/test_endpoints.py tests/test_config.py tests/test_auth.py -q

  # Glama builds the listing with `uv sync`, so uv.lock is what they actually
  # install. A lock that drifts from pyproject is worse than no lock at all.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # setup-uv publishes floating major tags only through v7; v8 and v9 exist
      # solely as exact version tags, so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Check uv.lock is up to date
        run: uv lock --check
